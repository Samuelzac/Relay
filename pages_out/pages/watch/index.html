<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Castlink Watch</title>

  <script src="https://web-broadcast.live-video.net/1.17.0/amazon-ivs-web-broadcast.js"></script>
  <script src="https://player.live-video.net/1.48.0/amazon-ivs-player.min.js"></script>

  <style>
    :root { color-scheme: dark; }
    html,body{height:100%}
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#000; color:#e8e8e8; margin:0; overflow:hidden;
    }
    header {
      padding:calc(12px + env(safe-area-inset-top)) 14px 10px; display:flex; gap:12px;
      align-items:center; justify-content:space-between; background:linear-gradient(to bottom, rgba(0,0,0,.72), rgba(0,0,0,0)); position:fixed; inset:0 0 auto 0; z-index:10;
    }
    .title { font-weight:700; }
    .pill {
      font-size:12px; padding:4px 8px; border:1px solid #2b2f3a; border-radius:999px; color:#cbd5e1; white-space:nowrap;
    }
    .pill.good { border-color:#1f6f4a; color:#bff7de; }
    .pill.warn { border-color:#7a5a0a; color:#ffe3a3; }
    .pill.bad { border-color:#7c2d38; color:#ffb4b4; }
    .pill.timewarn { border-color:#7a5a0a; color:#ffe3a3; }
    .topbar-right{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    }
    #modePill,#readyPill{display:none}
    main { padding:0; margin:0; }
    .card { border:1px solid #20232a; border-radius:14px; padding:12px; background:#0f1117; }
    .watch-layout{display:block}
    .player-card{position:fixed;inset:0;padding:0;overflow:hidden;background:#05070a;border:0;border-radius:0}
    .viewer-stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, #172033 0, #080a0f 42%, #030407 100%)}
    .idle-panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#cbd5e1}
    .idle-panel > div{max-width:470px}
    .idle-panel h1{margin:0 0 10px;font-size:30px;line-height:1.08;color:#fff}
    .idle-panel p{margin:0;color:#a8b3c3;line-height:1.55}
    .controls-card{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;width:auto;max-width:calc(100vw - 28px);background:rgba(10,12,18,.74);backdrop-filter:blur(16px);box-shadow:0 14px 40px rgba(0,0,0,.4);border-color:rgba(255,255,255,.14);padding:10px}
    .controls-card .row:first-child{display:none}
    .controls-card label,.controls-card select,#btnLoad,#btnStop{display:none}
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:0; }
    button {
      background:#1f2937; border:1px solid #334155; color:#e5e7eb; padding:10px 14px; border-radius:999px; cursor:pointer;font-weight:800;
    }
    button:disabled { opacity:0.55; cursor:not-allowed; }
    select, input {
      background:#0f172a; border:1px solid #334155; color:#e5e7eb; padding:9px 10px; border-radius:10px;
    }
    .player-shell{ position:absolute;inset:0;z-index:1; }
    video {
      width:100%;height:100svh; background:#000; border:0;
      min-height:100svh; max-height:none; object-fit:contain; display:block;
    }
    .videos {
      display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); min-height:100svh;padding:0;
    }
    .videos video{
      min-height:100svh; max-height:none;
    }
    .muted { color:#a3a3a3; }
    .err { color:#ffb4b4; }
    #hlsInfo,#rtcInfo{display:none!important;position:fixed;left:14px;bottom:calc(78px + env(safe-area-inset-bottom));right:14px;z-index:11;margin:0!important;text-align:center;font-size:12px;pointer-events:none;word-break:break-word}
    #hlsInfo{display:none}
    #readyInfo{display:none;margin:6px 0 0!important;font-size:12px;max-width:520px}
    #errorLine{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:14;width:max-content;max-width:calc(100vw - 28px);padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);text-align:center}
    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:12px; white-space:pre-wrap; background:#0b1220; border:1px solid #202a3a;
      border-radius:12px; padding:10px; max-height:55svh; overflow:auto;
    }
    .icon-btn{
      min-width:42px; padding:10px 12px; line-height:1;
    }
    .drawer{
      position:fixed; top:0; right:0; width:min(92vw, 420px); height:100svh; background:#0d1118;
      border-left:1px solid #20232a; box-shadow:-10px 0 30px rgba(0,0,0,.35); transform:translateX(100%);
      transition:transform .22s ease; z-index:40; display:flex; flex-direction:column;
    }
    .drawer.open{ transform:translateX(0); }
    .drawer-head{
      padding:14px; border-bottom:1px solid #20232a; display:flex; justify-content:space-between; align-items:center; gap:10px;
    }
    .drawer-body{
      padding:14px; overflow:auto; display:grid; gap:14px;
    }
    .overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:30;
    }
    .overlay.open{
      opacity:1; pointer-events:auto;
    }
    .modal{
      position:fixed; inset:auto 16px 16px 16px; max-width:560px; margin:0 auto; background:#0d1118;
      border:1px solid #283243; border-radius:12px; box-shadow:0 20px 70px rgba(0,0,0,.5); z-index:50;
      padding:14px; display:none;
    }
    .modal.open{display:block}
    .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
    .modal-body{display:grid;gap:10px}
    textarea{min-height:92px;resize:vertical;background:#0f172a;border:1px solid #334155;color:#e5e7eb;padding:9px 10px;border-radius:10px;font:inherit}
    .checkrow{display:flex;gap:8px;align-items:center;color:#cbd5e1}
    body.ui-hidden header,
    body.ui-hidden .controls-card,
    body.ui-hidden #errorLine{
      opacity:0;
      pointer-events:none;
      transition:opacity .22s ease;
    }
    header,.controls-card,#errorLine{transition:opacity .22s ease}
    @media (max-width:900px){
      .title{display:none}.topbar-right{width:100%;justify-content:space-between;gap:6px}.pill{font-size:11px;padding:4px 7px}
      .controls-card{left:10px;right:10px;transform:none;max-width:none}.controls-card .row:nth-child(2){justify-content:center}
      select{max-width:130px}
    }
  </style>
</head>
<body>
  <header>
    <div class="title">Castlink Watch</div>
    <div class="topbar-right">
      <span id="modePill" class="pill">mode: auto</span>
      <span id="statusPill" class="pill">status: —</span>
      <span id="readyPill" class="pill warn">ready: checking…</span>
      <span id="remainingPill" class="pill">remaining: —</span>
      <button id="menuBtn" class="icon-btn" aria-label="Open details">☰</button>
    </div>
  </header>

  <main>
    <div class="watch-layout">
    <section class="card player-card">
      <div class="viewer-stage">
        <div id="idlePanel" class="idle-panel">
          <div>
            <h1>Private stream viewer</h1>
            <p>Load the event when the broadcast is ready. If the stream is still preparing, Castlink will keep checking and show the next available playback mode.</p>
          </div>
        </div>
        <div class="player-shell">
          <div id="hlsWrap" style="display:none;">
            <video id="hlsVideo" playsinline controls autoplay></video>
            <div class="muted" id="hlsInfo" style="margin:8px 12px 12px;"></div>
          </div>

          <div id="rtcWrap" style="display:none;">
            <div class="videos" id="rtcVideos"></div>
            <div class="muted" id="rtcInfo" style="margin:8px 12px 12px;"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card controls-card">
      <div class="row">
        <label class="muted">Event</label>
        <input id="eventId" style="min-width:min(100%,280px);width:100%;" />
        <label class="muted">Key</label>
        <input id="eventKey" style="min-width:min(100%,280px);width:100%;" />
      </div>

      <div class="row">
        <label class="muted">Playback mode</label>
        <select id="mode">
          <option value="auto">Auto</option>
          <option value="hls">HLS (IVS Player)</option>
          <option value="rtc">WebRTC (Stage)</option>
        </select>

        <button id="btnLoad">Load / Refresh</button>
        <button id="btnPlay" disabled>Play</button>
        <button id="btnFullscreen">Full screen</button>
        <button id="btnStop">Stop</button>
        <button id="btnReport">Report</button>
      </div>

      <div id="errorLine" class="muted err" style="margin:6px 0 0; display:none;"></div>
      <div id="readyInfo" class="muted" style="margin:6px 0 10px;"></div>

    </section>
    </div>
  </main>

  <div id="overlay" class="overlay"></div>

  <section id="reportModal" class="modal" aria-hidden="true">
    <div class="modal-head">
      <strong>Report stream</strong>
      <button id="closeReportBtn" class="icon-btn" aria-label="Close report">x</button>
    </div>
    <div class="modal-body">
      <label class="muted">Reason
        <select id="reportReason">
          <option value="inappropriate">Inappropriate content</option>
          <option value="illegal">Illegal content</option>
          <option value="privacy">Privacy or consent issue</option>
          <option value="harassment">Harassment or abuse</option>
          <option value="technical">Technical issue</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label class="muted">Details
        <textarea id="reportDescription" placeholder="What happened?"></textarea>
      </label>
      <label class="muted">Your email (optional)
        <input id="reportEmail" type="email" placeholder="you@example.com" />
      </label>
      <label class="checkrow">
        <input id="reportUrgent" type="checkbox" />
        <span>This is urgent or safety-related</span>
      </label>
      <div class="row" style="margin-bottom:0;">
        <button id="submitReportBtn">Submit report</button>
        <span id="reportStatus" class="muted"></span>
      </div>
    </div>
  </section>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <strong>Details & Logs</strong>
      <button id="closeDrawerBtn" class="icon-btn" aria-label="Close details">✕</button>
    </div>
    <div class="drawer-body">
      <div>
        <div class="muted" style="margin-bottom:6px;">Event</div>
        <input id="drawerEventId" style="width:100%;" readonly />
      </div>

      <div>
        <div class="muted" style="margin-bottom:6px;">Key</div>
        <input id="drawerEventKey" style="width:100%;" readonly />
      </div>

      <div class="row" style="justify-content:space-between; margin-bottom:0;">
        <div class="muted">Logs</div>
        <button id="btnClear" style="padding:8px 10px;">Clear</button>
      </div>
      <div id="log" class="log"></div>
    </div>
  </aside>

<script src="/assets/relay-config.js"></script>
<script>
(() => {
  const API_BASE = window.RelayConfig.apiBase;

  const qs = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);

  const elEventId = $("eventId");
  const elEventKey = $("eventKey");
  const elDrawerEventId = $("drawerEventId");
  const elDrawerEventKey = $("drawerEventKey");
  const elMode = $("mode");
  const elModePill = $("modePill");
  const elStatusPill = $("statusPill");
  const elReadyPill = $("readyPill");
  const elRemainingPill = $("remainingPill");
  const elReadyInfo = $("readyInfo");
  const elLog = $("log");
  const elErr = $("errorLine");

  const elHlsWrap = $("hlsWrap");
  const elRtcWrap = $("rtcWrap");
  const elHlsInfo = $("hlsInfo");
  const elRtcInfo = $("rtcInfo");
  const elRtcVideos = $("rtcVideos");
  const elIdlePanel = $("idlePanel");

  elRemainingPill.textContent = "remaining: checking...";

  const btnLoad = $("btnLoad");
  const btnPlay = $("btnPlay");
  const btnFullscreen = $("btnFullscreen");
  const btnStop = $("btnStop");
  const btnClear = $("btnClear");
  const btnReport = $("btnReport");
  const btnCloseReport = $("closeReportBtn");
  const btnSubmitReport = $("submitReportBtn");
  const btnMenu = $("menuBtn");
  const btnCloseDrawer = $("closeDrawerBtn");
  const drawer = $("drawer");
  const overlay = $("overlay");
  const reportModal = $("reportModal");
  const reportReason = $("reportReason");
  const reportDescription = $("reportDescription");
  const reportEmail = $("reportEmail");
  const reportUrgent = $("reportUrgent");
  const reportStatus = $("reportStatus");

  let ev = null;
  let readyState = { ready:false, reason:"Checking event…" };
  let readinessTimer = null;
  let remainingTargetMs = null;
  let remainingTickTimer = null;
  let autoSelectedMode = null;
  let viewerSessionId = null;
  let viewerHeartbeat = null;

  let ivsPlayer = null;
  let hlsRetryTimer = null;
  let lastStartAt = 0;

  let stage = null;
  let stageToken = null;
  let autoPlayEnabled = qs.get("autoplay") !== "0";
  let autoPlayStarted = false;
  let playInFlight = false;
  let manualStop = false;
  let rtcMediaSeen = false;
  let rtcReconnectTimer = null;
  let rtcReconnectAttempts = 0;
  let uiHideTimer = null;

  elEventId.value = qs.get("event") || qs.get("id") || "";
  elEventKey.value = qs.get("key") || "";
  elDrawerEventId.value = elEventId.value;
  elDrawerEventKey.value = elEventKey.value;
  elMode.value = (qs.get("mode") || "auto").toLowerCase();

  function syncDrawerFields(){
    elDrawerEventId.value = elEventId.value;
    elDrawerEventKey.value = elEventKey.value;
  }

  function openDrawer(){
    syncDrawerFields();
    drawer.classList.add("open");
    overlay.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
  }

  function closeDrawer(){
    drawer.classList.remove("open");
    overlay.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
  }

  function openReport(){
    reportStatus.textContent = "";
    reportModal.classList.add("open");
    reportModal.setAttribute("aria-hidden", "false");
  }

  function closeReport(){
    reportModal.classList.remove("open");
    reportModal.setAttribute("aria-hidden", "true");
  }

  function showError(msg){
    if(!msg){
      elErr.style.display = "none";
      elErr.textContent = "";
      return;
    }
    const raw = String(msg);
    const userText = /full|viewer|capacity|expired|permission/i.test(raw)
      ? raw
      : "Not live yet. Waiting for the broadcaster.";
    elErr.style.display = "";
    elErr.textContent = userText;
    showViewerUi();
  }

  function log(...args){
    const line = args.map(a => typeof a === "string" ? a : JSON.stringify(a)).join(" ");
    elLog.textContent += line + "\n";
    elLog.scrollTop = elLog.scrollHeight;
    console.log(...args);
  }

  btnClear.onclick = () => { elLog.textContent = ""; };

  function setStatus(text){
    const raw = String(text || "").toLowerCase();
    let label = "Checking";
    let kind = "warn";
    if(raw.includes("playing") || raw.includes("receiving")) {
      label = "Playing";
      kind = "good";
    } else if(raw.includes("stopped")) {
      label = "Stopped";
      kind = "";
    } else if(raw.includes("error") || raw.includes("ended") || raw.includes("waiting") || raw.includes("not live")) {
      label = "Not live";
      kind = "warn";
    } else if(raw.includes("loading") || raw.includes("connecting") || raw.includes("checking")) {
      label = "Checking";
      kind = "warn";
    }
    elStatusPill.className = `pill ${kind}`.trim();
    elStatusPill.textContent = label;
  }
  function setModePill(){ elModePill.textContent = "mode: " + elMode.value; }
  function setReadyPill(ready, text, kind){
    elReadyPill.className = "pill " + (kind || (ready ? "good" : "warn"));
    elReadyPill.textContent = "ready: " + text;
  }

  function formatDuration(seconds){
    const s = Math.max(0, Number(seconds || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = Math.floor(s % 60);
    if (h > 0) return `${h}h ${String(m).padStart(2,"0")}m`;
    return `${m}m ${String(r).padStart(2,"0")}s`;
  }

  function formatRemainingMinutes(seconds){
    const s = Math.max(0, Number(seconds || 0));
    if (s <= 0) return "0m";
    return `${Math.ceil(s / 60)}m`;
  }

  function secondsUntilRemainingTarget(){
    if(!remainingTargetMs) return null;
    return Math.max(0, Math.ceil((remainingTargetMs - Date.now()) / 1000));
  }

  function renderRemaining(seconds, warning){
    elRemainingPill.className = "pill";
    if (seconds === null || seconds === undefined) {
      elRemainingPill.textContent = "remaining: not started";
      return;
    }
    elRemainingPill.textContent = "remaining: " + formatRemainingMinutes(seconds);
    if (seconds <= 120) elRemainingPill.className = "pill bad";
    else if (seconds <= 600) elRemainingPill.className = "pill timewarn";
    if (warning) elReadyInfo.textContent = warning;
  }

  function startRemainingTicker(){
    if(remainingTickTimer) return;
    remainingTickTimer = setInterval(() => {
      const seconds = secondsUntilRemainingTarget();
      if(seconds === null) return;
      renderRemaining(seconds);
    }, 1000);
  }

  function setRemaining(readiness){
    const seconds = readiness?.seconds_remaining;
    if (seconds === null || seconds === undefined) {
      remainingTargetMs = null;
      renderRemaining(null);
      return;
    }
    const expiresAt = readiness?.expires_at ? Date.parse(readiness.expires_at) : NaN;
    remainingTargetMs = Number.isFinite(expiresAt) ? expiresAt : Date.now() + Number(seconds) * 1000;
    renderRemaining(secondsUntilRemainingTarget() ?? seconds, readiness.warning);
    startRemainingTicker();
  }

  async function toggleFullscreen(){
    showViewerUi();
    try{
      if(document.fullscreenElement){
        await document.exitFullscreen();
        return;
      }
      const activeVideo = document.querySelector("#hlsWrap video, #rtcVideos video");
      if(activeVideo && typeof activeVideo.webkitEnterFullscreen === "function"){
        activeVideo.webkitEnterFullscreen();
        return;
      }
      const target = document.querySelector(".player-card") || document.documentElement;
      if(target.requestFullscreen){
        await target.requestFullscreen();
        return;
      }
      hideViewerUi();
    }catch(e){
      log("FULLSCREEN error:", String(e));
      hideViewerUi();
    }
  }

  function hideViewerUi(){
    if(drawer.classList.contains("open") || reportModal.classList.contains("open")) return;
    document.body.classList.add("ui-hidden");
  }

  function showViewerUi(){
    document.body.classList.remove("ui-hidden");
    clearTimeout(uiHideTimer);
    uiHideTimer = setTimeout(hideViewerUi, 3200);
  }
  function setReadyState(ready, reason, kind){
    readyState = { ready, reason };
    btnPlay.disabled = !ready;
    elReadyInfo.textContent = reason || "";
    setReadyPill(ready, ready ? "yes" : "no", kind);
    if(ready && autoPlayEnabled && !autoPlayStarted && !manualStop){
      setTimeout(() => autoPlayIfReady(), 50);
    }
  }

  function nudgeRtcAutoplayIfQuiet(){
    if(elMode.value !== "rtc" || rtcMediaSeen || manualStop || playInFlight || !readyState.ready) return;
    if(!autoPlayEnabled) return;
    autoPlayStarted = false;
    setTimeout(() => autoPlayIfReady(), 100);
  }

  function apiUrl(path){ return API_BASE + path; }

  async function fetchJson(path, init){
    const r = await fetch(apiUrl(path), init);
    const t = await r.text();
    let j = null;
    try { j = t ? JSON.parse(t) : null; } catch {}
    if(!r.ok){
      const msg = typeof j === "object" && j ? JSON.stringify(j) : t;
      const err = new Error(`${r.status} ${msg}`);
      err.status = r.status;
      err.body = j ?? t;
      throw err;
    }
    return j;
  }

  async function apiGet(path){
    return fetchJson(path, { method:"GET", credentials:"include", cache:"no-store" });
  }

  async function apiPost(path, body){
    return fetchJson(path, {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body: body ? JSON.stringify(body) : "{}",
      credentials:"include"
    });
  }

  async function submitReport(){
    const eventId = elEventId.value.trim();
    const key = elEventKey.value.trim();
    if(!eventId || !key) throw new Error("Missing event or key");
    btnSubmitReport.disabled = true;
    reportStatus.textContent = "Submitting...";
    try{
      const res = await apiPost(`/api/events/${encodeURIComponent(eventId)}/report?key=${encodeURIComponent(key)}`, {
        reason: reportReason.value,
        description: reportDescription.value,
        reporter_email: reportEmail.value,
        urgent: reportUrgent.checked,
      });
      reportStatus.textContent = res?.report_id ? "Report submitted" : "Submitted";
      reportDescription.value = "";
      reportUrgent.checked = false;
      setTimeout(closeReport, 900);
    }catch(e){
      reportStatus.textContent = String(e);
    }finally{
      btnSubmitReport.disabled = false;
    }
  }

  function showHls(){ elIdlePanel.style.display = "none"; elHlsWrap.style.display = ""; elRtcWrap.style.display = "none"; }
  function showRtc(){ elIdlePanel.style.display = "none"; elRtcWrap.style.display = ""; elHlsWrap.style.display = "none"; }
  function showNone(){ elIdlePanel.style.display = ""; elRtcWrap.style.display = "none"; elHlsWrap.style.display = "none"; }

  function applyModeForEvent(pub){
    const rtcEnabled = !!pub?.rtc_enabled;
    const hlsEnabled = !!pub?.hls_enabled;

    const optRtc = elMode.querySelector('option[value="rtc"]');
    const optHls = elMode.querySelector('option[value="hls"]');
    if(optRtc) optRtc.disabled = !rtcEnabled;
    if(optHls) optHls.disabled = !hlsEnabled;

    if(qs.get("mode")) return;

    if(elMode.value === "auto"){
      if(hlsEnabled && !rtcEnabled) {
        elMode.value = "hls";
        autoSelectedMode = "hls";
      } else if(rtcEnabled && !hlsEnabled) {
        elMode.value = "rtc";
        autoSelectedMode = "rtc";
      }
    }
  }

  async function loadPublic(){
    showError("");
    const eventId = elEventId.value.trim();
    const key = elEventKey.value.trim();
    if(!eventId || !key) throw new Error("Missing event or key");

    setStatus("loading…");
    if(!ev) elRemainingPill.textContent = "remaining: checking...";
    setModePill();

      const pub = await apiGet(`/api/events/${encodeURIComponent(eventId)}/public?key=${encodeURIComponent(key)}`);
      ev = pub;
      setRemaining(pub?.readiness);

    setStatus(pub.status || "ok");
    log("PUBLIC", pub);

    applyModeForEvent(pub);
    setModePill();

    if(elMode.value === "hls") showHls();
    else if(elMode.value === "rtc") showRtc();
    else showNone();

    return pub;
  }

  function stopReadinessPolling(){
    if(readinessTimer){
      clearTimeout(readinessTimer);
      readinessTimer = null;
    }
  }

  function scheduleReadiness(ms = 2500){
    stopReadinessPolling();
    readinessTimer = setTimeout(() => {
      readinessTimer = null;
      refreshReadiness().catch(e => {
        log("Readiness polling error", String(e));
        scheduleReadiness(2500);
      });
    }, ms);
  }

  function stopHls(){
    if(hlsRetryTimer){
      clearTimeout(hlsRetryTimer);
      hlsRetryTimer = null;
    }
    if(ivsPlayer){
      try { ivsPlayer.pause(); } catch {}
      try { ivsPlayer.delete(); } catch {}
      ivsPlayer = null;
    }
    const v = $("hlsVideo");
    v.srcObject = null;
    v.removeAttribute("src");
    v.load();
    elHlsInfo.textContent = "";
  }

  function isPlayerSupportedSafe(){
    if(!window.IVSPlayer) return false;

    try{
      if(typeof IVSPlayer.isPlayerSupported === "function") return !!IVSPlayer.isPlayerSupported();
      if(typeof IVSPlayer.isPlayerSupported === "boolean") return IVSPlayer.isPlayerSupported;
    }catch(e){
      log("IVS support check failed", String(e));
    }

    return typeof IVSPlayer.create === "function";
  }

  async function refreshReadiness(){
    showError("");
    try{
      if(!ev) await loadPublic();
      else ev = await loadPublic();

      if(ev.expired){
        setReadyState(false, "Event has expired.", "bad");
        return;
      }

      if(elMode.value === "hls"){
        if(!ev.hls_enabled){
          setReadyState(false, "This event is not HLS-enabled.", "bad");
          return;
        }

        ev = await loadPublic();

        if(!ev.playback_url){
          setReadyState(false, "Preparing HLS playback URL…", "warn");
          scheduleReadiness(2500);
          return;
        }

        setReadyState(true, ev?.readiness?.state === "waiting_for_stream" ? "Waiting for live media. Click Play." : "HLS is starting. Click Play.", "good");
        elHlsInfo.textContent = ev.playback_url;
        return;
      }

      if(elMode.value === "rtc"){
        if(!ev.rtc_enabled){
          setReadyState(false, "This event is not RTC-enabled.", "bad");
          return;
        }

        try{
          await rtcViewerToken(true);
          setReadyState(true, "RTC is ready. Click Play to connect.", "good");
          nudgeRtcAutoplayIfQuiet();
        }catch(e){
          setReadyState(false, "Preparing RTC viewer access…", "warn");
          log("RTC readiness failed", String(e));
          scheduleReadiness(2500);
        }
        return;
      }

      if(ev.rtc_enabled && !ev.hls_enabled){
        elMode.value = "rtc";
        setModePill();
        return refreshReadiness();
      }
      if(ev.hls_enabled && !ev.rtc_enabled){
        elMode.value = "hls";
        setModePill();
        return refreshReadiness();
      }
      if(ev.rtc_enabled){
        elMode.value = "rtc";
        setModePill();
        return refreshReadiness();
      }

      setReadyState(false, "Choose a playback mode.", "warn");
    } catch(e){
      log("READINESS error", String(e));
      setReadyState(false, String(e), "bad");
      scheduleReadiness(2500);
    }
  }

  async function playHls(){
    if(!ev) await loadPublic();
    if(!ev.hls_enabled) throw new Error("This event is not HLS-enabled.");

    ev = await loadPublic();

    const playbackUrl = ev.playback_url;
    if(!playbackUrl) throw new Error("No playback_url returned yet.");
    elHlsInfo.textContent = playbackUrl;

    const videoEl = $("hlsVideo");
    if(!isPlayerSupportedSafe()){
      throw new Error("IVS Player not supported in this browser.");
    }

    stopHls();

    ivsPlayer = IVSPlayer.create();
    ivsPlayer.attachHTMLVideoElement(videoEl);

    const tryLoad = async (label) => {
      if(!ivsPlayer) return;
      const urlNow = (ev && ev.playback_url) ? ev.playback_url : playbackUrl;
      log(`HLS load (${label})`, urlNow);
      try{
        ivsPlayer.load(urlNow);
        await ivsPlayer.play();
        setStatus("playing (hls)");
      }catch(e){
        log("HLS load/play threw", String(e));
        try{
          videoEl.muted = true;
          await ivsPlayer.play();
          setStatus("playing muted (hls)");
        }catch(e2){
          log("HLS muted autoplay failed", String(e2));
        }
      }
    };

    const scheduleRetry = (why) => {
      if(hlsRetryTimer) return;
      hlsRetryTimer = setTimeout(async () => {
        hlsRetryTimer = null;
        try{
          ev = await loadPublic();
          await refreshReadiness();
        }catch(e){
          log("HLS retry failed", String(e));
        }
        await tryLoad(why);
      }, 2500);
    };

    ivsPlayer.addEventListener(IVSPlayer.PlayerEventType.ERROR, (err) => {
      log("IVS ERROR", err);
      setStatus("hls error");
      scheduleRetry("retry");
    });

    ivsPlayer.addEventListener(IVSPlayer.PlayerEventType.ENDED, () => {
      log("IVS ENDED");
      setStatus("hls ended");
      scheduleRetry("ended-retry");
    });

    ivsPlayer.addEventListener(IVSPlayer.PlayerState.PLAYING, () => {
      setStatus("playing (hls)");
      showError("");
      setReadyState(true, "HLS is ready to watch.", "good");
    });

    await tryLoad("initial");
  }

  function stopRtc(){
    if(rtcReconnectTimer){
      clearTimeout(rtcReconnectTimer);
      rtcReconnectTimer = null;
    }
    try { stage && stage.leave(); } catch {}
    stage = null;
    stageToken = null;
    rtcMediaSeen = false;
    elRtcVideos.innerHTML = "";
    elRtcInfo.textContent = "";
  }

  async function acquireViewerSeat(){
    if(viewerSessionId) return;
    const eventId = elEventId.value.trim();
    const key = elEventKey.value.trim();
    const res = await apiPost(`/api/events/${encodeURIComponent(eventId)}/view-session?key=${encodeURIComponent(key)}`, {});
    if(res && res.granted === false){
      const active = Number(res.active || 0);
      const limit = Number(res.limit || 0);
      throw new Error(`This event is currently full (${active}/${limit} viewers). Try again shortly or ask the host to increase capacity.`);
    }
    viewerSessionId = res.session_id || null;
    clearInterval(viewerHeartbeat);
    viewerHeartbeat = setInterval(() => {
      if(!viewerSessionId) return;
      apiPost(`/api/events/${encodeURIComponent(eventId)}/heartbeat`, { session_id: viewerSessionId }).catch(e => log("viewer heartbeat failed", String(e)));
    }, 15000);
  }

  async function releaseViewerSeat(){
    if(viewerHeartbeat){
      clearInterval(viewerHeartbeat);
      viewerHeartbeat = null;
    }
    if(!viewerSessionId) return;
    const eventId = elEventId.value.trim();
    const sessionId = viewerSessionId;
    viewerSessionId = null;
    await apiPost(`/api/events/${encodeURIComponent(eventId)}/leave`, { session_id: sessionId }).catch(e => log("viewer leave failed", String(e)));
  }

  async function rtcViewerToken(silent = false){
    const eventId = elEventId.value.trim();
    const key = elEventKey.value.trim();
    const res = await apiPost(`/api/events/${encodeURIComponent(eventId)}/rtc/token?key=${encodeURIComponent(key)}`, {});
    stageToken = res.participantToken || res.token || res.subscriberToken || null;
    if(!stageToken) throw new Error("No participantToken returned from /rtc/token");
    if(!silent) log("RTC TOKEN ok");
    return res;
  }

  function createParticipantEl(id, label){
    let wrap = document.getElementById("p_" + id);
    if(wrap) return wrap.querySelector("video");

    wrap = document.createElement("div");
    wrap.id = "p_" + id;
    wrap.className = "card";
    wrap.style.padding = "8px";

    const cap = document.createElement("div");
    cap.className = "muted";
    cap.style.marginBottom = "6px";
    cap.textContent = label || id;

    const v = document.createElement("video");
    v.autoplay = true;
    v.playsInline = true;
    v.controls = false;
    v.muted = false;

    wrap.appendChild(cap);
    wrap.appendChild(v);
    elRtcVideos.appendChild(wrap);
    return v;
  }

  function removeParticipantEl(id){
    const wrap = document.getElementById("p_" + id);
    if(wrap) wrap.remove();
  }

  async function playRtc(){
    if(!ev) await loadPublic();
    if(!ev.rtc_enabled) throw new Error("This event is not RTC-enabled.");

    stopRtc();
    rtcMediaSeen = false;
    await rtcViewerToken();

    const sdk = window.IVSBroadcastClient;
    if(!sdk) throw new Error("IVS Web Broadcast SDK not loaded.");

    const { Stage, StageEvents, SubscribeType, StageConnectionState } = sdk;

    const strategy = {
      shouldPublishParticipant: () => false,
      stageStreamsToPublish: () => [],
      shouldSubscribeToParticipant: () => SubscribeType.AUDIO_VIDEO,
    };

    stage = new Stage(stageToken, strategy);

    stage.on(StageEvents.STAGE_CONNECTION_STATE_CHANGED, (state) => {
      log("RTC state", state);
      if(state === StageConnectionState.CONNECTED) {
        setStatus("playing (rtc)");
        elRtcInfo.textContent = "Connected. Waiting for broadcaster...";
        scheduleRtcReconnectIfQuiet();
      }
      if(state === StageConnectionState.CONNECTING) setStatus("rtc connecting...");
      if(state === StageConnectionState.ERRORED) {
        setStatus("rtc errored...");
        scheduleRtcReconnectIfQuiet(1500);
      }
      if(state === StageConnectionState.DISCONNECTED) setStatus("rtc disconnected");
    });

    stage.on(StageEvents.STAGE_PARTICIPANT_LEFT, (p) => {
      log("RTC left", p.id);
      removeParticipantEl(p.id);
    });

    stage.on(StageEvents.STAGE_PARTICIPANT_STREAMS_ADDED, (participant, streams) => {
      log("RTC streams added", participant.id, streams.map(s => s.streamType));
      rtcMediaSeen = true;
      rtcReconnectAttempts = 0;
      if(rtcReconnectTimer){
        clearTimeout(rtcReconnectTimer);
        rtcReconnectTimer = null;
      }
      const videoEl = createParticipantEl(participant.id, participant.info?.userInfo || participant.id);
      const ms = new MediaStream();
      streams.forEach(s => { if(s.mediaStreamTrack) ms.addTrack(s.mediaStreamTrack); });
      videoEl.srcObject = ms;
      videoEl.play().catch(async () => {
        videoEl.muted = true;
        await videoEl.play().catch(() => {});
      });
      elRtcInfo.textContent = "Receiving RTC media.";
    });

    stage.on(StageEvents.STAGE_PARTICIPANT_STREAMS_REMOVED, (participant) => {
      log("RTC streams removed", participant.id);
      removeParticipantEl(participant.id);
      rtcMediaSeen = false;
      scheduleRtcReconnectIfQuiet(2500);
    });

    await stage.join();
    elRtcInfo.textContent = "Connected. Waiting for broadcaster...";
    scheduleRtcReconnectIfQuiet(5000);
  }

  function scheduleRtcReconnectIfQuiet(delay = 5000){
    if(rtcMediaSeen || rtcReconnectTimer || manualStop || elMode.value !== "rtc") return;
    rtcReconnectTimer = setTimeout(async () => {
      rtcReconnectTimer = null;
      if(rtcMediaSeen || manualStop || elMode.value !== "rtc") return;
      rtcReconnectAttempts += 1;
      log("RTC reconnect", rtcReconnectAttempts);
      try{
        if(rtcReconnectAttempts > 1) await loadPublic().catch(() => {});
        await playRtc();
      }catch(e){
        log("RTC reconnect failed", String(e));
        scheduleRtcReconnectIfQuiet(Math.min(8000, 2500 + rtcReconnectAttempts * 500));
      }
    }, delay);
  }

  async function autoPlayIfReady(){
    if(!autoPlayEnabled || autoPlayStarted || playInFlight || manualStop || !readyState.ready) return;
    autoPlayStarted = true;
    await onPlay();
  }

  async function onPlay(){
    showError("");
    try{
      if(playInFlight) return;
      playInFlight = true;
      manualStop = false;
      btnPlay.disabled = true;
      await acquireViewerSeat();
      if(elMode.value === "hls") await playHls();
      else if(elMode.value === "rtc") await playRtc();
      else await loadPublic();
    }catch(e){
      log("PLAY error:", String(e));
      setStatus("error");
      showError(String(e));
      autoPlayStarted = false;
      await releaseViewerSeat();
      await refreshReadiness().catch(() => {});
    }finally{
      playInFlight = false;
      btnPlay.disabled = !readyState.ready;
    }
  }
  function onStop(){
    manualStop = true;
    autoPlayStarted = false;
    rtcReconnectAttempts = 0;
    stopHls();
    stopRtc();
    releaseViewerSeat();
    setStatus("stopped");
    showError("");
  }

  window.addEventListener("pagehide", () => {
    releaseViewerSeat();
  });

  btnLoad.onclick = async () => {
    showError("");
    stopReadinessPolling();
    try {
      await loadPublic();
      await refreshReadiness();
    } catch(e){
      log("LOAD error:", String(e));
      setStatus("error");
      showError(String(e));
      scheduleReadiness(2500);
    }
  };

  btnPlay.onclick = onPlay;
  btnFullscreen.onclick = toggleFullscreen;
  btnStop.onclick = onStop;
  btnReport.onclick = openReport;
  btnCloseReport.onclick = closeReport;
  btnSubmitReport.onclick = () => submitReport().catch(e => { reportStatus.textContent = String(e); });
  btnMenu.onclick = openDrawer;
  btnCloseDrawer.onclick = closeDrawer;
  overlay.onclick = () => {
    closeDrawer();
    closeReport();
    showViewerUi();
  };

  document.addEventListener("pointerdown", (event) => {
    if(event.target.closest("button,input,select,textarea,.drawer,.modal")) return;
    if(document.body.classList.contains("ui-hidden")) showViewerUi();
    else hideViewerUi();
  });

  document.addEventListener("keydown", (event) => {
    if(event.key === "Escape") {
      closeDrawer();
      closeReport();
    }
    showViewerUi();
  });

  elMode.onchange = () => {
    stopReadinessPolling();
    autoPlayStarted = false;
    manualStop = false;
    rtcReconnectAttempts = 0;
    setModePill();
    showNone();
    setReadyState(false, "Checking selected mode…", "warn");
    refreshReadiness().catch(e => {
      log("Mode change readiness error", String(e));
      scheduleReadiness(2500);
    });
  };

  function scheduleReloadFromInputs(){
    syncDrawerFields();
    stopReadinessPolling();
    setReadyState(false, "Checking event…", "warn");
    autoSelectedMode = null;
    autoPlayStarted = false;
    manualStop = false;
    rtcReconnectAttempts = 0;
    ev = null;
    setTimeout(() => {
      loadPublic().then(refreshReadiness).catch(e => {
        log("Input change error", String(e));
        showError(String(e));
        scheduleReadiness(2500);
      });
    }, 300);
  }

  elEventId.addEventListener("input", scheduleReloadFromInputs);
  elEventKey.addEventListener("input", scheduleReloadFromInputs);

  (async () => {
    try{
      showViewerUi();
      syncDrawerFields();
      await loadPublic();
      await refreshReadiness();
    }catch(e){
      log("Initial load failed:", String(e));
      setStatus("error");
      showError(String(e));
      scheduleReadiness(2500);
    }
  })();
})();
</script>
</body>
</html>
