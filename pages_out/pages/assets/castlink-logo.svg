<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">castlink.stream logo</title>
  <desc id="desc">A castlink.stream wordmark with a play icon, flowing stream underline, and subtle fishing line hook.</desc>
  <defs>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00A7C2"/>
      <stop offset="1" stop-color="#28C7C0"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="75" y1="260" x2="1160" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#006BA6"/>
      <stop offset="0.55" stop-color="#0099B8"/>
      <stop offset="1" stop-color="#20C7C6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#002B4D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left C / cast icon -->
  <g filter="url(#softShadow)">
    <path d="M246 104C222 75 181 60 140 70C89 83 52 128 52 181C52 238 97 285 154 287C194 288 225 273 247 247" stroke="#073763" stroke-width="26" stroke-linecap="round"/>
    <path d="M238 128C217 106 185 96 153 102C115 109 86 142 84 181C82 224 115 260 157 262C188 264 214 253 234 232" stroke="#0A5F91" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M134 154L185 182L134 210V154Z" fill="url(#tealGrad)"/>
  </g>

  <!-- Water stream / underline -->
  <path d="M55 247C106 279 173 283 235 263C288 246 334 244 402 247C558 255 792 259 1154 252" stroke="url(#waveGrad)" stroke-width="11" stroke-linecap="round"/>
  <path d="M78 269C130 292 187 286 238 267C289 248 344 248 412 252C575 262 800 263 1154 255" stroke="#53D7D0" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
  <path d="M235 263C410 260 681 260 1150 254" stroke="#073763" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M1150 254C1168 258 1165 284 1160 298C1156 310 1160 321 1169 315C1175 311 1172 301 1164 303" stroke="#12BFC3" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Wordmark -->
  <text x="250" y="222" font-family="Aptos, Inter, Montserrat, Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="-5" fill="#073763">castlink</text>
  <text x="744" y="222" font-family="Aptos, Inter, Montserrat, Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="-4" fill="url(#tealGrad)">.stream</text>
